name: Flowie QoS1 deferred source sanitizers

'on':
  push:
    branches: [feature/qos1-deferred-inbound-settlement-22]
    paths:
      - ".github/workflows/qos1-deferred-source-sanitizers.yml"
      - "client/**"
      - "connection/**"
      - "protocol/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "cmake/Sanitizers.cmake"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: flowie-source-qos1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Linux ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: asan-ubsan, address: "ON", undefined: "ON", thread: "OFF" }
          - { mode: tsan, address: "OFF", undefined: "OFF", thread: "ON" }
          - { mode: tsan-salts-source, address: "OFF", undefined: "OFF", thread: "ON" }
          - { mode: tsan-firstparty-source, address: "OFF", undefined: "OFF", thread: "ON" }
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - name: Restore one coherent published native SDK family
        shell: pwsh
        env:
          SDK_RID: linux-x64
        run: |
          $ErrorActionPreference = 'Stop'
          $downloads = Join-Path $env:RUNNER_TEMP 'flowie-downloads'
          $packages = Join-Path $env:RUNNER_TEMP 'flowie-sdk'
          New-Item -ItemType Directory -Path $downloads -Force | Out-Null

          # SDK compatibility epochs are checked here. We do not pin an exact
          # RC or silently fall back to stable releases from an older ABI.
          # The newest published package inside each compatible epoch wins.
          $sdks = @(
            @{ Repo='salts'; Package='Salts.Native'; Directory='salts'; Pattern='^v2\.3\.\d+(?:-rc\.\d+)?$' },
            @{ Repo='salts-utils'; Package='SaltsUtils.Native'; Directory='salts-utils'; Pattern='^v4\.3\.\d+(?:-rc\.\d+)?$' },
            @{ Repo='chttp'; Package='CHttp.Native'; Directory='http-services'; Pattern='^v2\.1\.\d+(?:-rc\.\d+)?$' },
            @{ Repo='turbodb'; Package='TurboDB.Native'; Directory='turbodb'; Pattern='^v2\.3\.\d+$' }
          )
          foreach ($sdk in $sdks) {
            $repository = 'qigao/' + $sdk.Repo
            $listing = & gh release list --repo $repository --limit 100 --json tagName,isDraft,isPrerelease,publishedAt
            if ($LASTEXITCODE -ne 0) { throw "Cannot list $($sdk.Package) releases" }
            $candidates = @($listing | ConvertFrom-Json | Where-Object {
              -not $_.isDraft -and $_.tagName -match $sdk.Pattern
            } | Sort-Object -Property publishedAt -Descending)
            if ($candidates.Count -eq 0) {
              throw "No published compatible SDK candidate found for $($sdk.Package)"
            }
            $tag = $candidates[0].tagName
            $releaseJson = & gh release view $tag --repo $repository --json tagName,assets
            if ($LASTEXITCODE -ne 0) { throw "Cannot resolve $($sdk.Package) $tag" }
            $release = $releaseJson | ConvertFrom-Json
            $assets = @($release.assets | Where-Object { $_.name -like ($sdk.Package + '.*.nupkg') })
            if ($assets.Count -ne 1) { throw "Expected one SDK asset for $($sdk.Package) at $tag" }
            $asset = $assets[0]
            & gh release download $tag --repo $repository --pattern $asset.name --dir $downloads
            if ($LASTEXITCODE -ne 0) { throw "Cannot download $($sdk.Package) at $tag" }
            $archive = Join-Path $downloads $asset.name
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($digest -ne $asset.digest) { throw "Digest mismatch for $($sdk.Package)" }
            $unpacked = Join-Path $downloads $sdk.Directory
            [IO.Compression.ZipFile]::ExtractToDirectory($archive, $unpacked)
            $source = Join-Path $unpacked ('sdk/' + $env:SDK_RID)
            if (-not (Test-Path -LiteralPath $source -PathType Container)) {
              throw "Missing compatible $($env:SDK_RID) SDK: $source"
            }
            $parent = Join-Path $packages $sdk.Directory
            New-Item -ItemType Directory -Path $parent -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination (Join-Path $parent 'release') -Recurse
            Write-Output "$($sdk.Package)=$tag $digest"
            "- $($sdk.Package) $tag ($digest)" >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/checkout@v4
        if: matrix.mode == 'tsan-salts-source' || matrix.mode == 'tsan-firstparty-source'
        with:
          repository: qigao/salts
          # Immutable tree behind the published v2.3.0-rc.17 tag.
          ref: 6d6fd387cb245be8d7b0d866f9babad026a26832
          path: build/upstream/salts
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.mode == 'tsan-firstparty-source'
        with:
          repository: qigao/salts-utils
          ref: fbb5f3ee19589836ced0f3b98414e71e6dcc1388
          path: build/upstream/salts-utils
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.mode == 'tsan-firstparty-source'
        with:
          repository: qigao/chttp
          ref: 960c7cbca53084e03625cc0c8278f2cf815ce7b6
          path: build/upstream/chttp
          persist-credentials: false
      - name: Prepare Linux source sanitizer host
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config gcc g++ ccache
          chmod +x "$RUNNER_TEMP/flowie-sdk/salts-utils/release/bin/salts-idlc"
      - name: Build the EXACT published Salts/CNet source with TSan
        if: matrix.mode == 'tsan-salts-source' || matrix.mode == 'tsan-firstparty-source'
        shell: bash
        run: |
          set -euo pipefail
          cd build/upstream/salts
          test "$(git rev-parse HEAD)" = "6d6fd387cb245be8d7b0d866f9babad026a26832"
          # Salts owns its registry; never switch its cryptographic provider
          # to a Flowie overlay or a guessed ABI.
          unset VCPKG_OVERLAY_PORTS
          export PROJECT_ROOT="$GITHUB_WORKSPACE"
          cmake --preset linux-release-ci \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_ASAN=OFF -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_THREAD=ON \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset linux-release-ci --parallel 2
          cmake --build --preset install-linux-release-ci --parallel 2
          test -f stage/sdk/linux-x64/lib/libsalts.so
          test -f stage/sdk/linux-x64/lib/libcnet.so
          nm -D stage/sdk/linux-x64/lib/libsalts.so | grep '__tsan_init' >/dev/null
          nm -D stage/sdk/linux-x64/lib/libcnet.so | grep '__tsan_init' >/dev/null
          rm -rf "$RUNNER_TEMP/flowie-sdk/salts/release"
          cp -a stage/sdk/linux-x64 "$RUNNER_TEMP/flowie-sdk/salts/release"
          printf 'salts_source=%s\nupstream_sanitizer=tsan\n' \
            "$(git rev-parse HEAD)" > "$GITHUB_WORKSPACE/salts-tsan-source.txt"
      - name: Build exact SaltsUtils and CHttp sources with TSan
        if: matrix.mode == 'tsan-firstparty-source'
        shell: bash
        run: |
          set -euo pipefail
          utils_sha=fbb5f3ee19589836ced0f3b98414e71e6dcc1388
          chttp_sha=960c7cbca53084e03625cc0c8278f2cf815ce7b6
          utils_src="$GITHUB_WORKSPACE/build/upstream/salts-utils"
          chttp_src="$GITHUB_WORKSPACE/build/upstream/chttp"
          test "$(git -C "$utils_src" rev-parse HEAD)" = "$utils_sha"
          test "$(git -C "$chttp_src" rev-parse HEAD)" = "$chttp_sha"
          salts_root="$RUNNER_TEMP/flowie-sdk/salts/release"
          utils_root="$RUNNER_TEMP/flowie-sdk/salts-utils/release"
          chttp_root="$RUNNER_TEMP/flowie-sdk/http-services/release"
          export SALTS_ROOT="$salts_root"
          export LD_LIBRARY_PATH="$salts_root/lib:$salts_root/bin:$utils_root/lib:$utils_root/bin:${LD_LIBRARY_PATH:-}"
          export VCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          cmake --preset ci-linux-release-user -S "$utils_src" -B build/qos1-build-utils-tsan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$utils_root" \
            -DCMAKE_PREFIX_PATH="$salts_root;$VCPKG_INSTALLED_DIR/x64-linux" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_THREAD=ON -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/qos1-build-utils-tsan --parallel 2
          rm -rf "$utils_root"
          cmake --install build/qos1-build-utils-tsan --prefix "$utils_root"
          test -f "$utils_root/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          export SALTS_UTILS_ROOT="$utils_root"
          export DATABIND_ROOT="$utils_root"
          cmake --preset ci-linux-release-user -S "$chttp_src" -B build/qos1-build-chttp-tsan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$chttp_root" \
            -DCMAKE_PREFIX_PATH="$salts_root;$utils_root;$VCPKG_INSTALLED_DIR/x64-linux" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTS=OFF -DBUILD_TESTING=OFF -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_THREAD=ON -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/qos1-build-chttp-tsan --parallel 2
          rm -rf "$chttp_root"
          cmake --install build/qos1-build-chttp-tsan --prefix "$chttp_root"
          test -f "$chttp_root/lib/cmake/Chttp/ChttpConfig.cmake"
          python3 - <<'PY'
          import json
          from pathlib import Path
          required = {
              "SaltsUtils": Path("build/qos1-build-utils-tsan/compile_commands.json"),
              "CHttp": Path("build/qos1-build-chttp-tsan/compile_commands.json")
          }
          for title, path in required.items():
              commands=json.loads(path.read_text())
              missing=[row["file"] for row in commands if "-fsanitize=thread" not in
                       (row.get("command") or " ".join(row.get("arguments",[])))]
              print(f"{title}: {len(commands)} compile units, {len(missing)} missing TSan")
              if not commands or missing:
                  raise SystemExit(f"{title} source instrumentation absent: {missing[:6]}")
          PY
          printf 'saltsutils_source=%s\nchttp_source=%s\nfirstparty_sanitizer=tsan\n' \
            "$utils_sha" "$chttp_sha" >> salts-tsan-source.txt
      - name: Compile Flowie Client and native wire tests with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          build="build/qos1-sanitize-${{ matrix.mode }}"
          cmake --preset ci-linux-release-user -B "$build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFLOWIE_BUILD_CONTROL=OFF -DFLOWIE_BUILD_SERVER=OFF -DFLOWIE_BUILD_CLUSTER=OFF \
            -DENABLE_SANITIZER_ADDRESS=${{ matrix.address }} \
            -DENABLE_SANITIZER_UNDEFINED=${{ matrix.undefined }} \
            -DENABLE_SANITIZER_THREAD=${{ matrix.thread }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build "$build" --parallel 2 --target \
            test_flowie_mqtt_qos1_deferred_state \
            test_flowie_mqtt_qos1_deferred_wire \
            test_flowie_mqtt_qos1_deferred_overflow \
            test_flowie_mqtt_qos1_deferred_queue_full \
            test_flowie_mqtt_qos1_deferred_destroy_pending
          test -f "$build/bin/libflowie_client.so"
          printf 'flowie=%s\nmode=%s\nproducer_sdk=published_uninstrumented_unless_salts_source_variant\n' \
            "$(git rev-parse HEAD)" "${{ matrix.mode }}" > "$build/provenance.txt"
          if test -f salts-tsan-source.txt; then cat salts-tsan-source.txt >> "$build/provenance.txt"; fi
          # Resolve libraries from the same TSan-installed first-party
          # graph as the subsequent CTest; a bare CI-shell ldd would falsely
          # mark the newly built libdata_bind.so as missing.
          export LD_LIBRARY_PATH="$PWD/$build/bin:$RUNNER_TEMP/flowie-sdk/salts/release/lib:$RUNNER_TEMP/flowie-sdk/salts-utils/release/lib:$RUNNER_TEMP/flowie-sdk/http-services/release/lib:$RUNNER_TEMP/flowie-sdk/turbodb/release/lib:$PWD/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ldd "$build/bin/libflowie_client.so" | tee "$build/dependencies.txt"
          if grep -q 'not found' "$build/dependencies.txt"; then
            echo "Source dependency closure incomplete: shared object not found" >&2
            exit 1
          fi
          if test "${{ matrix.mode }}" = tsan-firstparty-source; then
            echo "== actual real-wire executable dynamic dependencies =="
            ldd "$build/bin/test_flowie_mqtt_qos1_deferred_wire" | tee -a "$build/dependencies.txt"
            if grep -q 'not found' "$build/dependencies.txt"; then
              echo "Actual native consumer dependency closure incomplete" >&2
              exit 1
            fi
            test -f "$RUNNER_TEMP/flowie-sdk/http-services/release/lib/libchttp_server.so"
            nm -D "$RUNNER_TEMP/flowie-sdk/http-services/release/lib/libchttp_server.so" | grep '__tsan_init' >/dev/null
            grep -F "$RUNNER_TEMP/flowie-sdk/http-services/release/lib" "$build/dependencies.txt"
            grep -F "$RUNNER_TEMP/flowie-sdk/salts-utils/release/lib" "$build/dependencies.txt"
          fi
      - name: Repeat actual QoS1 wire/owner race and state tests under instrumentation
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:history_size=7:second_deadlock_stack=1
        run: |
          set -euo pipefail
          build="build/qos1-sanitize-${{ matrix.mode }}"
          export LD_LIBRARY_PATH="$PWD/$build/bin:$RUNNER_TEMP/flowie-sdk/salts/release/lib:$RUNNER_TEMP/flowie-sdk/salts-utils/release/lib:$RUNNER_TEMP/flowie-sdk/http-services/release/lib:$RUNNER_TEMP/flowie-sdk/turbodb/release/lib:$PWD/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir "$build" --no-tests=error --output-on-failure \
            --timeout 60 --repeat until-fail:10 \
            -R '^flowie[.]mqtt[.]qos1_deferred_(state|wire|overflow|queue_full|destroy_pending)$' \
            2>&1 | tee "$build/sanitizer-ctest.log"
      - name: Preserve instrumented Flowie source evidence even on RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qos1-source-${{ matrix.mode }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/qos1-sanitize-${{ matrix.mode }}/provenance.txt
            build/qos1-sanitize-${{ matrix.mode }}/dependencies.txt
            build/qos1-sanitize-${{ matrix.mode }}/sanitizer-ctest.log
            build/qos1-sanitize-${{ matrix.mode }}/Testing/Temporary/LastTest.log
