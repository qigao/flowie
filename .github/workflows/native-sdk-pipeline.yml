name: Flowie native SDK archives

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - id: meta
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          version = json.loads(Path("vcpkg.json").read_text(encoding="utf-8"))["version-semver"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise ValueError("Flowie must declare an exact release version")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("version=" + version + "\n")

  sdk:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            profile: linux-gcc-x64
            preset: ci-gcc-release-user
            native: true
          - os: windows-2025
            rid: windows-x64
            profile: windows-msvc-x64
            preset: ci-msvc-release-user
            native: true
          - os: ubuntu-24.04
            rid: android-arm64-v8a
            profile: android-arm64
            preset: ci-android-arm64-release-user
            native: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check script contracts
        run: python -B -m unittest discover -s cmake/ci -p "test_*.py"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - id: configuration
        name: Materialize .env from the source revision
        run: python -B cmake/ci/setup_native_ci.py --materialize ${{ matrix.profile }}
      - uses: actions/checkout@v4
        with:
          repository: qigao/vcpkg-cache
          ref: ${{ steps.configuration.outputs.ref }}
          path: ${{ steps.configuration.outputs.infrastructure }}
          persist-credentials: false
      - name: Restore shared vcpkg and host generators
        run: python -B cmake/ci/setup_native_ci.py
      - name: Restore exact published SDK archives
        shell: pwsh
        run: |
          & ./cmake/ci/restore-native-sdks.ps1 -Rid "${{ matrix.rid }}" -Profile "${{ matrix.profile }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure the complete build graph
        run: cmake --fresh --preset ${{ matrix.preset }}
      - name: Build the configured graph
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Run formal CTest
        if: matrix.native
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error -j 1
      - name: Install the SDK
        run: cmake --install build/${{ matrix.preset }}
      - name: Package the original installation
        shell: python
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          PROFILE: ${{ matrix.profile }}
          PRESET: ${{ matrix.preset }}
          NATIVE_TESTS: ${{ matrix.native }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          import hashlib, importlib.util, json, os, subprocess, tarfile
          from pathlib import Path
          preset = os.environ["PRESET"]
          version = os.environ["VERSION"]
          build = Path("build") / preset
          cache = dict(line.split("=", 1) for line in
                       (build / "CMakeCache.txt").read_text(encoding="utf-8").splitlines()
                       if line.startswith("CMAKE_PROJECT_VERSION:STATIC="))
          if cache["CMAKE_PROJECT_VERSION:STATIC"] != version:
              raise ValueError("Configured CMake version differs from the release identity")
          stage = build / "stage"
          (stage / "lib/cmake/Flowie/FlowieConfig.cmake").read_bytes()
          dist = Path("dist")
          dist.mkdir()
          name = "flowie-" + version + "-" + os.environ["PROFILE"] + ".tar"
          archive = dist / name
          with tarfile.open(archive, "w") as package:
              package.add(stage, arcname=".")
          spec = importlib.util.spec_from_file_location("settings", "cmake/ci/restore-native-sdks.py")
          settings = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(settings)
          values = settings.load_environment_file(".env", {})
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if source != os.environ["SOURCE_SHA"]:
              raise ValueError("Archive source differs from the requested revision")
          if os.environ["NATIVE_TESTS"] != "true":
              readelf = Path(values["ANDROID_NDK_HOME"]) / "toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
              for library in stage.rglob("*.so"):
                  headers = subprocess.check_output([str(readelf), "--program-headers", "--wide", str(library)], text=True)
                  loads = [line.split() for line in headers.splitlines() if line.lstrip().startswith("LOAD ")]
                  if not loads or any(int(fields[-1], 16) < 16384 for fields in loads):
                      raise ValueError("Android ELF requires 16 KiB LOAD alignment: " + str(library))
          with archive.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          metadata = {
              "profile": os.environ["PROFILE"], "file": name,
              "sizeBytes": archive.stat().st_size,
              "sha256": digest,
              "source": os.environ["SOURCE_SHA"],
              "native_tests": os.environ["NATIVE_TESTS"] == "true",
              "dependencies": {key: values[key] for key in settings.VERSIONS.values()}}
          (dist / (os.environ["PROFILE"] + ".json")).write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
      - uses: actions/upload-artifact@v4
        with:
          name: flowie-sdk-${{ matrix.profile }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.native
        with:
          name: flowie-tests-${{ matrix.profile }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/flowie/client/app/tests/workbench-*.bmp
          if-no-files-found: warn

  archives:
    needs: [metadata, sdk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flowie-sdk-*
          merge-multiple: true
          path: dist
      - name: Record release identities and checksums
        shell: python
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          import hashlib, json, os
          from pathlib import Path
          dist = Path("dist")
          sdks = [json.loads(path.read_text(encoding="utf-8"))
                  for path in sorted(dist.glob("*.json"))]
          if len(sdks) != 3 or any(item["source"] != os.environ["SOURCE_SHA"] for item in sdks):
              raise ValueError("Incomplete or inconsistent platform archives")
          if any(item["dependencies"] != sdks[0]["dependencies"] for item in sdks):
              raise ValueError("Platform SDKs used different dependency releases")
          manifest = dist / ("flowie-" + os.environ["VERSION"] + "-manifest.json")
          manifest.write_text(json.dumps({
              "schema": 1, "name": "Flowie", "version": os.environ["VERSION"],
              "commit": os.environ["SOURCE_SHA"], "producer_run": os.environ["GITHUB_RUN_ID"],
              "sdks": sdks}, indent=2) + "\n", encoding="utf-8")
          files = sorted(dist.glob("*.tar")) + [manifest]
          checksums = []
          for path in files:
              with path.open("rb") as stream:
                  checksums.append(hashlib.file_digest(stream, "sha256").hexdigest() + "  " + path.name + "\n")
          (dist / "SHA256SUMS").write_text("".join(checksums), encoding="utf-8")
      - uses: actions/upload-artifact@v4
        with:
          name: flowie-native-sdk-${{ needs.metadata.outputs.version }}
          path: |
            dist/*.tar
            dist/*-manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
