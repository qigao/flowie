            echo "SALTS_ROOT=$packages/salts.native/$SALTS_VERSION/sdk/android-arm64-v8a"
            echo "SALTS_UTILS_ROOT=$packages/saltsutils.native/$SALTS_UTILS_VERSION/sdk/android-arm64-v8a"
            echo "HTTP_SERVICES_ROOT=$packages/chttp.native/$CHTTP_VERSION/sdk/android-arm64-v8a"
            echo "TURBODB_ROOT=$packages/turbodb.native/$TURBODB_VERSION/sdk/android-arm64-v8a"
          } >> "$GITHUB_ENV"

      - name: Restore Android consumer graph from shared cache only
        shell: bash
        run: |
          set -euo pipefail
          install_root="$GITHUB_WORKSPACE/vcpkg_installed"
          rm -rf "$install_root"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$GITHUB_WORKSPACE" \
            --x-install-root="$install_root" \
            --triplet arm64-android \
            --only-binarycaching
          echo "VCPKG_INSTALLED_DIR=$install_root" >> "$GITHUB_ENV"

      - name: Configure and link Android external consumer
        shell: bash
        run: |
          set -euxo pipefail
          consumer="$RUNNER_TEMP/flowie-release-consumer-android"
          mkdir -p "$consumer"
          cat > "$consumer/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(FlowieReleaseConsumer LANGUAGES C CXX)
          find_package(Flowie CONFIG REQUIRED
                       PATHS "$ENV{FLOWIE_ROOT}" NO_DEFAULT_PATH
                       NO_CMAKE_FIND_ROOT_PATH)
          add_executable(flowie_release_consumer main.c)
          target_link_libraries(flowie_release_consumer PRIVATE
                                Flowie::Flowie Flowie::Client Flowie::Protocol)
          EOF
          cat > "$consumer/main.c" <<'EOF'
          #include <flowie.h>
          #include <flowie_mqtt_client.h>
          #include <flowie_mqtt_protocol.h>
          int main(void) {
            flowie_endpoint_config_t endpoint = FLOWIE_ENDPOINT_CONFIG_INIT;
            return endpoint.size == sizeof(endpoint) ? 0 : 1;
          }
          EOF
          cmake -S "$consumer" -B "$consumer/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared
          cmake --build "$consumer/build" --parallel 2
