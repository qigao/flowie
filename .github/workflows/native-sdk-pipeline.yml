name: Flowie native SDK pipeline

on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      source_sha:
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  SALTS_VERSION: "1.8.3"
  SALTS_UTILS_VERSION: "4.1.3"
  CHTTP_VERSION: "1.1.4"
  TURBODB_VERSION: "1.0.0"
  FLOWMQ_VERSION: "1.1.1"
  TURBORAFT_VERSION: "0.2.0"

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - id: meta
        name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import re; s=open("CMakeLists.txt", encoding="utf-8").read(); m=re.search(r"project\\s*\\(\\s*Flowie\\s+VERSION\\s+([0-9]+\\.[0-9]+\\.[0-9]+)", s, re.I); print(m.group(1) if m else "")')"
          manifest_version="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["version-semver"])')"
          test "$version" = "$manifest_version"
          test "$version" = "1.0.0"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x64 SDK
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
        with:
          version: "4.6.3"

      - name: Prepare build host
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config
          test -n "$VCPKG_ROOT"
          test -n "$QIGAO_VCPKG_TOOLCHAIN_FILE"
          test -f "$QIGAO_VCPKG_TOOLCHAIN_FILE"

      - name: Restore released producer SDKs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/flowie-release-dependencies"
          config="$RUNNER_TEMP/flowie-release.config"
          project="$RUNNER_TEMP/flowie-release.csproj"
          printf '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json             --name github --username qigao --password "$GITHUB_TOKEN"             --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Salts.Native" Version="[$SALTS_VERSION]" />
              <PackageReference Include="SaltsUtils.Native" Version="[$SALTS_UTILS_VERSION]" />
              <PackageReference Include="CHttp.Native" Version="[$CHTTP_VERSION]" />
              <PackageReference Include="TurboDB.Native" Version="[$TURBODB_VERSION]" />
              <PackageReference Include="FlowMQ.Native" Version="[$FLOWMQ_VERSION]" />
              <PackageReference Include="TurboRaft.Native" Version="[$TURBORAFT_VERSION]" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$project" --packages "$packages" --configfile "$config" --no-cache

          salts_root="$packages/salts.native/$SALTS_VERSION/sdk/linux-x64"
          salts_utils_root="$packages/saltsutils.native/$SALTS_UTILS_VERSION/sdk/linux-x64"
          chttp_root="$packages/chttp.native/$CHTTP_VERSION/sdk/linux-x64"
          turbodb_root="$packages/turbodb.native/$TURBODB_VERSION/sdk/linux-x64"
          flowmq_root="$packages/flowmq.native/$FLOWMQ_VERSION/sdk/linux-x64"
          turboraft_root="$packages/turboraft.native/$TURBORAFT_VERSION/sdk/linux-x64"

          test -f "$salts_root/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$salts_utils_root/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$chttp_root/lib/cmake/Chttp/ChttpConfig.cmake"
          test -f "$turbodb_root/lib/cmake/Orm/OrmConfig.cmake"
          test -f "$flowmq_root/lib/cmake/FlowMQ/FlowMQConfig.cmake"
          test -f "$turboraft_root/lib/cmake/TurboRaft/TurboRaftConfig.cmake"

          {
            echo "SALTS_ROOT=$salts_root"
            echo "SALTS_UTILS_ROOT=$salts_utils_root"
            echo "HTTP_SERVICES_ROOT=$chttp_root"
            echo "TURBODB_ROOT=$turbodb_root"
            echo "FLOWMQ_ROOT=$flowmq_root"
            echo "TURBORAFT_ROOT=$turboraft_root"
            echo "RELEASE_PACKAGES=$packages"
          } >> "$GITHUB_ENV"

      - name: Restore Flowie third-party graph from shared cache only
        shell: bash
        run: |
          set -euo pipefail
          install_root="$GITHUB_WORKSPACE/vcpkg_installed"
          log="$RUNNER_TEMP/flowie-release-vcpkg.log"
          rm -rf "$install_root" "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          set +e
          "$VCPKG_ROOT/vcpkg" install             --x-manifest-root="$GITHUB_WORKSPACE"             --x-install-root="$install_root"             --triplet x64-linux             --only-binarycaching 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -Eq '^Building [^:]+:x64-linux' "$log"; then
            echo "source build detected in release dependency graph" >&2
            exit 1
          fi
          echo "VCPKG_INSTALLED_DIR=$install_root" >> "$GITHUB_ENV"

      - name: Configure complete release graph
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/release-sdk -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR"             -DVCPKG_MANIFEST_MODE=OFF             -DFLOWIE_BUILD_TESTS=ON             -DFLOWIE_BUILD_CONTROL=ON             -DFLOWIE_BUILD_CLUSTER=ON             -DFLOWIE_MQTT_PUBLIC_LIVE_TESTS=OFF             -DFLOWIE_TURBODB_LIVE_TESTS=OFF             -DFLOWIE_MQTT_FIXED_INTEROP_TESTS=OFF             -DFLOWIE_MQTT_SOAK_TESTS=OFF             -DENABLE_SANITIZER_ADDRESS=OFF             -DENABLE_SANITIZER_UNDEFINED=OFF

      - name: Build and qualify complete release graph
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/release-sdk --parallel 2
          export LD_LIBRARY_PATH="$TURBORAFT_ROOT/lib:$TURBORAFT_ROOT/bin:$FLOWMQ_ROOT/lib:$FLOWMQ_ROOT/bin:$HTTP_SERVICES_ROOT/lib:$HTTP_SERVICES_ROOT/bin:$TURBODB_ROOT/lib:$TURBODB_ROOT/bin:$SALTS_UTILS_ROOT/lib:$SALTS_UTILS_ROOT/bin:$SALTS_ROOT/lib:$SALTS_ROOT/bin:$VCPKG_INSTALLED_DIR/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/release-sdk             -R '^(flowie_server_docker_entrypoint_contract|test_flowie_mqtt_protocol|test_flowie_mqtt_protocol_matrix|test_flowie_mqtt_protocol_corpus|test_flowie_mqtt_client|test_flowie_connection|test_flow_execution|test_flowie_core|test_flowie_security|test_flowie_session_delivery_index|test_flowie_transport_baseline|test_flowie_cluster.*|test_flowie_topic_index|test_flowie_server_config|test_flowie_server_http_security|test_flowie_server_turbodb_config)$'             --no-tests=error --output-on-failure --timeout 180

      - name: Install release SDK
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/linux-x64"
          cmake --install build/release-sdk --prefix "$prefix" --strip
          test -f "$prefix/lib/cmake/Flowie/FlowieConfig.cmake"
          test -f "$prefix/lib/cmake/Flowie/FlowieConfigVersion.cmake"
          test -f "$prefix/lib/cmake/Flowie/FlowieTargets.cmake"
          test -f "$prefix/include/flowie.h"
          test -f "$prefix/include/flowie_mqtt_client.h"
          test -f "$prefix/include/flowie_mqtt_protocol.h"
          test -f "$prefix/lib/libflowie.so"
          test -f "$prefix/lib/libflowie_client.so"
          test -f "$prefix/lib/libflowie_protocol.a"
          cat > "$prefix/flowie-sdk-manifest.txt" <<EOF
          package=Flowie.Native
          version=${{ needs.metadata.outputs.version }}
          source=${{ inputs.source_sha }}
          rid=linux-x64
          salts=$SALTS_VERSION
          saltsutils=$SALTS_UTILS_VERSION
          chttp=$CHTTP_VERSION
          turbodb=$TURBODB_VERSION
          orm=2.1.0
          flowmq_qualification=$FLOWMQ_VERSION
          turboraft_qualification=$TURBORAFT_VERSION
          profile=Release
          qualification=runtime
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: flowie-sdk-linux-x64
          path: stage/sdk/linux-x64
          if-no-files-found: error
          compression-level: 9

  pack:
    name: Pack Flowie.Native
    needs: [metadata, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: flowie-sdk-linux-x64
          path: package/sdk/linux-x64

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify SDK payload
        shell: bash
        run: |
          set -euo pipefail
          test -f package/sdk/linux-x64/lib/cmake/Flowie/FlowieConfig.cmake
          test -f package/sdk/linux-x64/lib/libflowie.so
          test -f package/sdk/linux-x64/lib/libflowie_client.so
          test -f package/sdk/linux-x64/lib/libflowie_protocol.a
          grep -Fq "version=${{ needs.metadata.outputs.version }}" package/sdk/linux-x64/flowie-sdk-manifest.txt

      - name: Pack NuGet
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/flowie-pack.config"
          printf '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json             --name github --username qigao --password "$GITHUB_TOKEN"             --store-password-in-clear-text --configfile "$config"
          dotnet restore packaging/nuget/Flowie.Native.csproj             --configfile "$config" --packages "$RUNNER_TEMP/flowie-pack-dependencies"
          dotnet pack packaging/nuget/Flowie.Native.csproj             --no-restore --configuration Release --output dist             -p:PackageVersion="${{ needs.metadata.outputs.version }}"             -p:PackageRoot="$GITHUB_WORKSPACE/package"             -p:RestorePackagesPath="$RUNNER_TEMP/flowie-pack-dependencies"             -p:RepositoryCommit="${{ inputs.source_sha }}"
          nupkg="dist/Flowie.Native.${{ needs.metadata.outputs.version }}.nupkg"
          test -f "$nupkg"
          unzip -Z1 "$nupkg" | sort | tee "$RUNNER_TEMP/flowie-nupkg.txt"
          grep -Fx "sdk/linux-x64/lib/cmake/Flowie/FlowieConfig.cmake" "$RUNNER_TEMP/flowie-nupkg.txt"
          grep -Fx "sdk/linux-x64/include/flowie.h" "$RUNNER_TEMP/flowie-nupkg.txt"
          grep -Fx "sdk/linux-x64/lib/libflowie.so" "$RUNNER_TEMP/flowie-nupkg.txt"
          unzip -p "$nupkg" "Flowie.Native.nuspec" > "$RUNNER_TEMP/flowie.nuspec"
          grep -F 'id="Salts.Native" version="[1.8.3]"' "$RUNNER_TEMP/flowie.nuspec"
          grep -F 'id="SaltsUtils.Native" version="[4.1.3]"' "$RUNNER_TEMP/flowie.nuspec"
          grep -F 'id="CHttp.Native" version="[1.1.4]"' "$RUNNER_TEMP/flowie.nuspec"
          grep -F 'id="TurboDB.Native" version="[1.0.0]"' "$RUNNER_TEMP/flowie.nuspec"

      - uses: actions/upload-artifact@v4
        with:
          name: Flowie.Native.${{ needs.metadata.outputs.version }}
          path: dist/*.nupkg
          if-no-files-found: error

  qualify:
    name: Qualify packed Flowie.Native
    needs: [metadata, pack]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: Flowie.Native.${{ needs.metadata.outputs.version }}
          path: dist

      - name: Prepare qualification host
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Restore packed SDK and dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/flowie-qualify.config"
          project="$RUNNER_TEMP/flowie-qualify.csproj"
          packages="$RUNNER_TEMP/flowie-qualify-packages"
          printf '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source "$GITHUB_WORKSPACE/dist" --name local --configfile "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json             --name github --username qigao --password "$GITHUB_TOKEN"             --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup><PackageReference Include="Flowie.Native" Version="[${{ needs.metadata.outputs.version }}]" /></ItemGroup>
          </Project>
          EOF
          dotnet restore "$project" --packages "$packages" --configfile "$config" --no-cache
          {
            echo "FLOWIE_ROOT=$packages/flowie.native/${{ needs.metadata.outputs.version }}/sdk/linux-x64"
            echo "SALTS_ROOT=$packages/salts.native/$SALTS_VERSION/sdk/linux-x64"
            echo "SALTS_UTILS_ROOT=$packages/saltsutils.native/$SALTS_UTILS_VERSION/sdk/linux-x64"
            echo "HTTP_SERVICES_ROOT=$packages/chttp.native/$CHTTP_VERSION/sdk/linux-x64"
            echo "TURBODB_ROOT=$packages/turbodb.native/$TURBODB_VERSION/sdk/linux-x64"
          } >> "$GITHUB_ENV"

      - name: Restore consumer vcpkg graph from shared cache only
        shell: bash
        run: |
          set -euo pipefail
          install_root="$GITHUB_WORKSPACE/vcpkg_installed"
          rm -rf "$install_root"
          "$VCPKG_ROOT/vcpkg" install             --x-manifest-root="$GITHUB_WORKSPACE"             --x-install-root="$install_root"             --triplet x64-linux             --only-binarycaching
          echo "VCPKG_INSTALLED_DIR=$install_root" >> "$GITHUB_ENV"

      - name: Configure, build and run external consumer
        shell: bash
        run: |
          set -euxo pipefail
          consumer="$RUNNER_TEMP/flowie-release-consumer"
          rm -rf "$consumer"
          mkdir -p "$consumer"
          cat > "$consumer/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(FlowieReleaseConsumer LANGUAGES C CXX)
          find_package(Flowie 1.0.0 EXACT CONFIG REQUIRED
                       PATHS "$ENV{FLOWIE_ROOT}" NO_DEFAULT_PATH)
          add_executable(flowie_release_consumer main.c)
          target_link_libraries(flowie_release_consumer PRIVATE
                                Flowie::Flowie Flowie::Client Flowie::Protocol)
          EOF
          cat > "$consumer/main.c" <<'EOF'
          #include <flowie.h>
          #include <flowie_mqtt_client.h>
          #include <flowie_mqtt_protocol.h>
          int main(void) {
            flowie_endpoint_config_t endpoint = FLOWIE_ENDPOINT_CONFIG_INIT;
            return endpoint.size == sizeof(endpoint) ? 0 : 1;
          }
          EOF
          cmake -S "$consumer" -B "$consumer/build" -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR"             -DVCPKG_MANIFEST_MODE=OFF
          cmake --build "$consumer/build" --parallel 2
          export LD_LIBRARY_PATH="$FLOWIE_ROOT/lib:$FLOWIE_ROOT/bin:$HTTP_SERVICES_ROOT/lib:$HTTP_SERVICES_ROOT/bin:$TURBODB_ROOT/lib:$TURBODB_ROOT/bin:$SALTS_UTILS_ROOT/lib:$SALTS_UTILS_ROOT/bin:$SALTS_ROOT/lib:$SALTS_ROOT/bin:$VCPKG_INSTALLED_DIR/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          "$consumer/build/flowie_release_consumer"

  publish:
    name: Publish package and GitHub Release
    if: ${{ inputs.publish }}
    needs: [metadata, qualify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Flowie.Native.${{ needs.metadata.outputs.version }}
          path: dist

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish to qigao GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json             --name github --username qigao --password "$GITHUB_TOKEN"             --store-password-in-clear-text
          dotnet nuget push "dist/Flowie.Native.${{ needs.metadata.outputs.version }}.nupkg"             --api-key "$GITHUB_TOKEN" --source github --skip-duplicate

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          pkg="dist/Flowie.Native.$VERSION.nupkg"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$pkg" --repo "$GITHUB_REPOSITORY"               --verify-tag --title "Flowie $VERSION" --generate-notes
          else
            gh release create "$tag" "$pkg" --repo "$GITHUB_REPOSITORY"               --target "$SOURCE_SHA" --title "Flowie $VERSION" --generate-notes
          fi
