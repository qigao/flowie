name: Flowie native SDK release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read

concurrency:
  group: flowie-native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: meta
        shell: python
        run: |
          import json, os, re, subprocess
          from pathlib import Path
          version = json.loads(Path("vcpkg.json").read_text(encoding="utf-8"))["version-semver"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise ValueError("Expected an exact Flowie version")
          tag = "v" + version
          if os.environ["GITHUB_REF_TYPE"] != "tag" or os.environ["GITHUB_REF_NAME"] != tag:
              raise ValueError("Pushed tag differs from the Flowie version")
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("source_sha=" + source + "\nversion=" + version + "\ntag=" + tag + "\n")

  build:
    needs: validate
    uses: ./.github/workflows/native-sdk-pipeline.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flowie-native-sdk-${{ needs.validate.outputs.version }}
          path: dist
      - name: Verify and publish original SDK archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$TAG" ./*.tar "flowie-$VERSION-manifest.json" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --fail-on-no-commits \
            --title "Flowie $VERSION" --generate-notes
