name: Flowie native SDK qualification

on:
  pull_request:
    branches: [master]
    paths:
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "Dockerfile"
      - "vcpkg.json"
      - "cmake/**"
      - "presets/**"
      - "tools/**"
      - "vendor/**"
      - "transport/**"
      - "connection/**"
      - "protocol/**"
      - "client/**"
      - "flowie/**"
      - "cluster/**"
      - "server/**"
      - "control/**"
      - "deploy/**"
      - "interop/**"
      - "packaging/**"
      - ".github/workflows/native-tests.yml"
      - ".github/workflows/native-sdk-pipeline.yml"
      - ".github/workflows/native-sdk-qualification.yml"
      - ".github/workflows/native-sdk-release.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: flowie-native-sdk-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify Salts 3 development integration
    uses: ./.github/workflows/native-tests.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
