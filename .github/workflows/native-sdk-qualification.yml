name: Flowie native SDK qualification

on:
  push:
    branches: ['**']
    paths-ignore:
      - "cmake/**"
      - "CMakeLists.txt"
      - "**/CMakeLists.txt"
      - ".cmake-format"
      - "**.cmake"
      - "**.json"
      - "docs/**"
      - "**/docs/**"
      - "**.[mM][dD]"
      - "**.[rR][sS][tT]"
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "Dockerfile"
      - "presets/**"
      - "tools/**"
      - "vendor/**"
      - "flowie/**"
      - "tests/**"
      - "deploy/**"
      - "interop/**"
      - ".github/workflows/**"
      - "!**/CMakeLists.txt"
      - "!**.cmake"
      - "!**.json"
      - "!**/docs/**"
      - "!**.[mM][dD]"
      - "!**.[rR][sS][tT]"

permissions:
  actions: read
  contents: read

concurrency:
  group: flowie-native-sdk-qualification-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify native SDK archives
    uses: ./.github/workflows/native-sdk-pipeline.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
