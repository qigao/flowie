name: Flowie native SDK qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "Dockerfile"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "cmake/**"
      - "presets/**"
      - "tools/**"
      - "vendor/**"
      - "flowie/**"
      - "tests/**"
      - "deploy/**"
      - "interop/**"
      - ".github/workflows/native-sdk-pipeline.yml"
      - ".github/workflows/native-sdk-qualification.yml"
      - ".github/workflows/native-sdk-release.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: flowie-native-sdk-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify native SDK archives
    uses: ./.github/workflows/native-sdk-pipeline.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
