name: Flowie native tests

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      salts_ref:
        description: Optional Salts commit to build and qualify before Flowie
        type: string
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  group: flowie-native-tests-${{ github.ref }}
  cancel-in-progress: true

# Published 2.3/4.3/2.1 release candidates form one native SDK ABI epoch.
# A manual source SHA is a qualification override only; push CI consumes packages.
env:
  SALTS_SOURCE_REF: ${{ inputs.salts_ref || '' }}

jobs:
  test:
    name: ${{ matrix.rid }} Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: windows-x64
            compiler: msvc
            preset: ci-win-release-user
          - os: ubuntu-24.04
            rid: linux-x64
            compiler: gcc
            preset: ci-linux-release-user
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 750M
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore ccache (independent of vcpkg binary cache)
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: flowie-ace-cnet23-ccache-v1-${{ matrix.rid }}-${{ hashFiles('CMakeLists.txt', 'CMakeOptions.cmake', 'vcpkg.json') }}-${{ github.sha }}
          restore-keys: |
            flowie-ace-cnet23-ccache-v1-${{ matrix.rid }}-${{ hashFiles('CMakeLists.txt', 'CMakeOptions.cmake', 'vcpkg.json') }}-
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - uses: actions/checkout@v4
        if: env.SALTS_SOURCE_REF != ''
        with:
          repository: qigao/salts
          ref: ${{ env.SALTS_SOURCE_REF }}
          path: build/dependencies/salts
          persist-credentials: false
      - name: Restore one coherent published native SDK family
        shell: pwsh
        env:
          SDK_RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $downloads = Join-Path $env:RUNNER_TEMP 'flowie-downloads'
          $packages = Join-Path $env:RUNNER_TEMP 'flowie-sdk'
          New-Item -ItemType Directory -Path $downloads -Force | Out-Null

          # SDK compatibility epochs are checked here. We do not pin an exact
          # RC or silently fall back to stable releases from an older ABI.
          # The newest published package inside each compatible epoch wins.
          $sdks = @(
            @{ Repo='salts'; Package='Salts.Native'; Directory='salts'; Pattern='^v2\.3\.\d+(?:-rc\.\d+)?$' },
            @{ Repo='salts-utils'; Package='SaltsUtils.Native'; Directory='salts-utils'; Pattern='^v4\.3\.\d+(?:-rc\.\d+)?$' },
            @{ Repo='chttp'; Package='CHttp.Native'; Directory='http-services'; Pattern='^v2\.1\.\d+(?:-rc\.\d+)?$' },
            @{ Repo='turbodb'; Package='TurboDB.Native'; Directory='turbodb'; Pattern='^v2\.3\.\d+$' }
          )
          foreach ($sdk in $sdks) {
            if ($sdk.Repo -eq 'salts' -and $env:SALTS_SOURCE_REF) { continue }
            $repository = 'qigao/' + $sdk.Repo
            $listing = & gh release list --repo $repository --limit 100 --json tagName,isDraft,isPrerelease,publishedAt
            if ($LASTEXITCODE -ne 0) { throw "Cannot list $($sdk.Package) releases" }
            $candidates = @($listing | ConvertFrom-Json | Where-Object {
              -not $_.isDraft -and $_.tagName -match $sdk.Pattern
            } | Sort-Object -Property publishedAt -Descending)
            if ($candidates.Count -eq 0) {
              throw "No published compatible SDK candidate found for $($sdk.Package)"
            }
            $tag = $candidates[0].tagName
            $releaseJson = & gh release view $tag --repo $repository --json tagName,assets
            if ($LASTEXITCODE -ne 0) { throw "Cannot resolve $($sdk.Package) $tag" }
            $release = $releaseJson | ConvertFrom-Json
            $assets = @($release.assets | Where-Object { $_.name -like ($sdk.Package + '.*.nupkg') })
            if ($assets.Count -ne 1) { throw "Expected one SDK asset for $($sdk.Package) at $tag" }
            $asset = $assets[0]
            & gh release download $tag --repo $repository --pattern $asset.name --dir $downloads
            if ($LASTEXITCODE -ne 0) { throw "Cannot download $($sdk.Package) at $tag" }
            $archive = Join-Path $downloads $asset.name
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($digest -ne $asset.digest) { throw "Digest mismatch for $($sdk.Package)" }
            $unpacked = Join-Path $downloads $sdk.Directory
            [IO.Compression.ZipFile]::ExtractToDirectory($archive, $unpacked)
            $source = Join-Path $unpacked ('sdk/' + $env:SDK_RID)
            if (-not (Test-Path -LiteralPath $source -PathType Container)) {
              throw "Missing compatible $($env:SDK_RID) SDK: $source"
            }
            $parent = Join-Path $packages $sdk.Directory
            New-Item -ItemType Directory -Path $parent -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination (Join-Path $parent 'release') -Recurse
            Write-Output "$($sdk.Package)=$tag $digest"
            "- $($sdk.Package) $tag ($digest)" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Prepare Linux host
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config ccache
          ccache --version
          # NuGet stores this host tool as 0644; restore execution permission after extraction.
          chmod +x "$RUNNER_TEMP/flowie-sdk/salts-utils/release/bin/salts-idlc"
      - name: Qualify candidate Salts on Linux
        if: runner.os == 'Linux' && env.SALTS_SOURCE_REF != ''
        shell: bash
        working-directory: build/dependencies/salts
        run: |
          set -euo pipefail
          # The candidate's registry lock owns its provider version.
          unset VCPKG_OVERLAY_PORTS
          export PROJECT_ROOT="$GITHUB_WORKSPACE"
          cmake --preset linux-release-ci -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset linux-release-ci --parallel 2
          ctest --preset linux-release-ci -R '^cnet_.*test$' --no-tests=error --timeout 180 --output-on-failure
          cmake --build --preset install-linux-release-ci --parallel 2
          mkdir -p "$RUNNER_TEMP/flowie-sdk/salts"
          cp -a stage/sdk/linux-x64 "$RUNNER_TEMP/flowie-sdk/salts/release"
      - name: Configure, build and test Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-linux-release-user -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset ci-linux-release-user --parallel 2
          ctest --preset ci-linux-release-user --timeout 180 --output-junit build/native-ci/results.xml
      - name: Install and test external C11/C++17 consumer (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build --preset install-ci-linux-release-user --parallel 2
          export PKG_ROOT="$RUNNER_TEMP/flowie-sdk"
          export FLOWIE_ROOT="$PKG_ROOT/flowie/release"
          export SALTS_ROOT="$PKG_ROOT/salts/release"
          export SALTS_UTILS_ROOT="$PKG_ROOT/salts-utils/release"
          export HTTP_SERVICES_ROOT="$PKG_ROOT/http-services/release"
          export TURBODB_ROOT="$PKG_ROOT/turbodb/release"
          test -f "$FLOWIE_ROOT/lib/cmake/Flowie/FlowieConfig.cmake"
          cmake -S tests/installed-sdk -B build/flowie-installed-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFlowie_DIR="$FLOWIE_ROOT/lib/cmake/Flowie" \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/flowie-installed-consumer --parallel 2
          export LD_LIBRARY_PATH="$FLOWIE_ROOT/lib:$FLOWIE_ROOT/bin:$SALTS_ROOT/lib:$SALTS_UTILS_ROOT/lib:$HTTP_SERVICES_ROOT/lib:$TURBODB_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/flowie-installed-consumer --timeout 45 --output-on-failure
      - name: Locate Windows compiler and install ccache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ccache -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install ccache' }
          ccache --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot run ccache' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) { throw 'Visual Studio C++ toolchain not found' }
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
      - name: Qualify candidate Salts on Windows
        if: runner.os == 'Windows' && env.SALTS_SOURCE_REF != ''
        shell: cmd
        working-directory: build/dependencies/salts
        run: |
          set "BUILD_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%BUILD_VCPKG_ROOT%"
          set "VCPKG_OVERLAY_PORTS="
          set "VCPKG_WINDOWS_TRIPLET=x64-windows"
          set "PROJECT_ROOT=%GITHUB_WORKSPACE%"
          cmake --preset win-release-ci -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          if errorlevel 1 exit /b 1
          cmake --build --preset win-release-ci --parallel 2
          if errorlevel 1 exit /b 1
          ctest --preset win-release-ci -R "^cnet_.*test$" --no-tests=error --timeout 180 --output-on-failure
          if errorlevel 1 exit /b 1
          cmake --build --preset install-win-release-ci --parallel 2
          if errorlevel 1 exit /b 1
          powershell -NoProfile -Command "New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'flowie-sdk/salts') | Out-Null; Copy-Item -LiteralPath 'stage/sdk/windows-x64' -Destination (Join-Path $env:RUNNER_TEMP 'flowie-sdk/salts/release') -Recurse -ErrorAction Stop"
          if errorlevel 1 exit /b 1
      - name: Configure, build and test Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --preset ci-win-release-user -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          if errorlevel 1 exit /b 1
          cmake --build --preset ci-win-release-user --parallel 2
          if errorlevel 1 exit /b 1
          ctest --preset ci-win-release-user --timeout 180 --output-junit build/native-ci/results.xml
          if errorlevel 1 exit /b 1
      - name: Install and test external C11/C++17 consumer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --build --preset install-ci-win-release-user --parallel 2
          if errorlevel 1 exit /b 1
          set "PKG_ROOT=%RUNNER_TEMP%\flowie-sdk"
          set "FLOWIE_ROOT=%PKG_ROOT%\flowie\release"
          set "SALTS_ROOT=%PKG_ROOT%\salts\release"
          set "SALTS_UTILS_ROOT=%PKG_ROOT%\salts-utils\release"
          set "HTTP_SERVICES_ROOT=%PKG_ROOT%\http-services\release"
          set "TURBODB_ROOT=%PKG_ROOT%\turbodb\release"
          if not exist "%FLOWIE_ROOT%\lib\cmake\Flowie\FlowieConfig.cmake" exit /b 1
          set "PATH=%FLOWIE_ROOT%\bin;%SALTS_ROOT%\bin;%SALTS_UTILS_ROOT%\bin;%HTTP_SERVICES_ROOT%\bin;%TURBODB_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\x64-windows\bin;%PATH%"
          cmake -S tests/installed-sdk -B build/flowie-installed-consumer -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DFlowie_DIR="%FLOWIE_ROOT%/lib/cmake/Flowie" ^
            -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%/vcpkg_installed" ^
            -DVCPKG_MANIFEST_MODE=OFF ^
            -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          if errorlevel 1 exit /b 1
          cmake --build build/flowie-installed-consumer --parallel 2
          if errorlevel 1 exit /b 1
          ctest --test-dir build/flowie-installed-consumer --timeout 45 --output-on-failure
          if errorlevel 1 exit /b 1
      - name: Report compiler cache statistics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build/native-ci -Force | Out-Null
          $statistics = & ccache --show-stats
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read ccache statistics' }
          $statistics | Set-Content -Path build/native-ci/ccache-stats.txt
          $statistics | Write-Output
          "### Compiler cache: ${{ matrix.rid }} / ${{ matrix.compiler }} / ${{ matrix.preset }}" >> $env:GITHUB_STEP_SUMMARY
          '```text' >> $env:GITHUB_STEP_SUMMARY
          $statistics >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tests-${{ matrix.rid }}
          path: |
            build/native-ci/results.xml
            build/native-ci/Testing/Temporary/LastTest.log
            build/native-ci/CMakeFiles/CMakeConfigureLog.yaml
            build/native-ci/ccache-stats.txt
            build/dependencies/salts/build/**/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
