name: Flowie native tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: flowie-native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/native-sdk-pipeline.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit
