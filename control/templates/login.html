<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Flowie Control</title>
  <link rel="stylesheet" href="/v2/control/assets/control.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-panel" aria-labelledby="login-title">
      <header class="auth-brand">
        <span class="brand__mark" aria-hidden="true">F</span>
        <p class="eyebrow">Management plane</p>
        <h1 id="login-title">Flowie Control</h1>
        <p>Sign in to manage identities, access policies and backend integrations.</p>
      </header>

      <nav class="scope-switch" aria-label="Sign-in scope">
        <a href="/v2/control/login" {% if system_mode %}aria-current="page"{% endif %}>System administrator</a>
        <a href="/v2/control/login?scope=group" {% if group_mode %}aria-current="page"{% endif %}>Domain</a>
      </nav>

      {% if error %}<p class="auth-error" role="alert">The username or password is incorrect.</p>{% endif %}

      <form class="auth-form" method="post" action="/v2/control/login">
        {% if system_mode %}
        <input type="hidden" name="domain" value="system">
        <div class="scope-field"><span>Scope</span><strong>System</strong></div>
        {% endif %}
        {% if group_mode %}
        <label>Domain
          <input name="domain" required maxlength="128" autocomplete="organization" placeholder="root-a">
        </label>
        {% endif %}
        <label>Username
          <input name="principal" required maxlength="128" autocomplete="username">
        </label>
        <label>Password
          <input name="password" type="password" required maxlength="4096" autocomplete="current-password">
        </label>
        <button type="submit">Continue to Control</button>
      </form>
    </section>
  </main>
</body>
</html>
