services:
  flowie-server:
    image: ${FLOWIE_SERVER_IMAGE:?set FLOWIE_SERVER_IMAGE to an immutable tag or digest}
    container_name: flowie-server
    entrypoint:
      - /usr/local/bin/flowie-combined-entrypoint
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      FLOWIE_HOST: ${FLOWIE_HOST:-127.0.0.1}
      FLOWIE_PORT: ${FLOWIE_PORT:-18883}
      FLOWIE_TRANSPORT: ${FLOWIE_TRANSPORT:-tcp}
      FLOWIE_PATH: ${FLOWIE_PATH:-/mqtt}
      FLOWIE_MAX_PACKET_SIZE: ${FLOWIE_MAX_PACKET_SIZE:-1048576}
      FLOWIE_MAX_CONNECTIONS: ${FLOWIE_MAX_CONNECTIONS:-1024}
      FLOWIE_MAX_SESSIONS: ${FLOWIE_MAX_SESSIONS:-${FLOWIE_MAX_CONNECTIONS:-1024}}
      FLOWIE_MAX_SUBSCRIPTIONS_PER_SESSION: ${FLOWIE_MAX_SUBSCRIPTIONS_PER_SESSION:-1024}
      FLOWIE_MAX_INFLIGHT_PER_SESSION: ${FLOWIE_MAX_INFLIGHT_PER_SESSION:-64}
      FLOWIE_MAX_RETAINED_MESSAGES: ${FLOWIE_MAX_RETAINED_MESSAGES:-${FLOWIE_MAX_SESSIONS:-${FLOWIE_MAX_CONNECTIONS:-1024}}}
      FLOWIE_SEND_HWM_BYTES: ${FLOWIE_SEND_HWM_BYTES:-1048576}
      FLOWIE_COROUTINE_STACK_SIZE: ${FLOWIE_COROUTINE_STACK_SIZE:-0}
      FLOWIE_STREAM_RECV_BUFFER_BYTES: ${FLOWIE_STREAM_RECV_BUFFER_BYTES:-0}
      FLOWIE_SOCKET_RECV_BUFFER_BYTES: ${FLOWIE_SOCKET_RECV_BUFFER_BYTES:-0}
      FLOWIE_SOCKET_SEND_BUFFER_BYTES: ${FLOWIE_SOCKET_SEND_BUFFER_BYTES:-0}
      FLOWIE_TIMEOUT_MS: ${FLOWIE_TIMEOUT_MS:-0}
      FLOWIE_RECV_TIMEOUT_MS: ${FLOWIE_RECV_TIMEOUT_MS:-0}
      FLOWIE_TCP_KEEPALIVE: ${FLOWIE_TCP_KEEPALIVE:-0}
      FLOWIE_TCP_KEEPALIVE_IDLE_MS: ${FLOWIE_TCP_KEEPALIVE_IDLE_MS:-0}
      FLOWIE_TCP_KEEPALIVE_INTERVAL_MS: ${FLOWIE_TCP_KEEPALIVE_INTERVAL_MS:-0}
      FLOWIE_TCP_KEEPALIVE_COUNT: ${FLOWIE_TCP_KEEPALIVE_COUNT:-0}
      FLOWIE_REUSE_PORT: ${FLOWIE_REUSE_PORT:-0}
      FLOWIE_LOG_LEVEL: ${FLOWIE_LOG_LEVEL:-INFO}
      FLOWIE_COMBINED_CHECK: ${FLOWIE_COMBINED_CHECK:-0}
      FLOWIE_CONTROL_CONFIG: /etc/flowie/control.yml
      FLOWIE_CONTROL_CHECK: ${FLOWIE_CONTROL_CHECK:-0}
      FLOWIE_CONTROL_KEY_PASSWORD_FILE: /run/secrets/flowie-control-key-password
      FLOWIE_HEALTH_HOST: ${FLOWIE_HEALTH_HOST:-127.0.0.1}
      FLOWIE_HEALTH_PORT: ${FLOWIE_HEALTH_PORT:-${FLOWIE_PORT:-18883}}
      FLOWIE_HEALTH_SECONDARY_HOST: ${FLOWIE_CONTROL_HEALTH_HOST:-127.0.0.1}
      FLOWIE_HEALTH_SECONDARY_PORT: ${FLOWIE_CONTROL_HEALTH_PORT:-8443}
    secrets:
      - source: flowie-control-key-password
        target: flowie-control-key-password
    volumes:
      - flowie-data:/var/lib/flowie
      - ${FLOWIE_CONTROL_CONFIG_FILE:?set FLOWIE_CONTROL_CONFIG_FILE}:/etc/flowie/control.yml:ro
      - ${FLOWIE_CERT_DIR:?set FLOWIE_CERT_DIR}:/etc/flowie/certs:ro
      - flowie-control-data:/var/lib/flowie/control
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=16m,mode=0755
    healthcheck:
      test: ["CMD", "/usr/local/bin/flowie-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  flowie-data:
    name: ${FLOWIE_DATA_VOLUME:-flowie-data}
  flowie-control-data:
    name: ${FLOWIE_CONTROL_DATA_VOLUME:-flowie-control-data}

secrets:
  flowie-control-key-password:
    file: ${FLOWIE_CONTROL_KEY_PASSWORD_FILE:?set FLOWIE_CONTROL_KEY_PASSWORD_FILE}
